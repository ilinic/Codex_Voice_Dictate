name: Build Windows application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore src/CodexVoiceDictate/CodexVoiceDictate.csproj
      - name: Build
        run: dotnet build src/CodexVoiceDictate/CodexVoiceDictate.csproj --configuration Release --no-restore -p:Version=0.1.${{ github.run_number }}
      - name: Publish self-contained Windows executable
        run: dotnet publish src/CodexVoiceDictate/CodexVoiceDictate.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=0.1.${{ github.run_number }} --output publish
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: CodexVoiceDictate-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: CodexVoiceDictate-win-x64
          path: publish
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "publish/CodexVoiceDictate.exe" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Codex Voice Dictate $tag" --notes "Portable Windows x64 executable. Run it and configure the API key from the tray icon." --latest
